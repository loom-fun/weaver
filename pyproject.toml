[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weaver-loom"
dynamic = ["version"]
description = "Port, optimize and serve Hugging Face LLMs on AMD Loom with a local coding agent"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "hrx-loom[hf]==0.1.0",
  # the loom-skills tools venv (loom-setup/scripts/install_loom.sh)
  "gguf", "numpy", "tokenizers", "requests", "jinja2", "fastapi", "uvicorn", "httpx",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
weaver = "weaver.cli:main"

[tool.setuptools.dynamic]
version = { attr = "weaver.__version__" }

[tool.setuptools.packages.find]
include = ["weaver*"]

[tool.setuptools.package-data]
weaver = ["prompts/*.md", "templates/*", "_vendor/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
