name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tier0:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.LOOM_SKILLS_TOKEN || github.token }}   # loom-skills is private
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install '.[test]'
      - run: pytest -q
      - run: bash -n packaging/build_bundle.sh && sh -n packaging/launcher.sh && bash -n install.sh && bash -n evals/tier2_smoke.sh && bash -n evals/release_check.sh
  bundle:
    needs: tier0
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.LOOM_SKILLS_TOKEN || github.token }}
      - run: packaging/build_bundle.sh
      - run: evals/tier1_container.sh packaging/out
      - uses: actions/upload-artifact@v4
        with:
          name: weaver-release
          path: |
            packaging/out/weaver-linux-x64.tar.gz
            packaging/out/install.sh
            packaging/out/SHA256SUMS
