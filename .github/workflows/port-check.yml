name: port-check
# A real `weaver port` on an AMD DevLab Dispatch Strix Halo runner (never a developer's GPU), installed
# the way a user installs it, with its output straight in the job log: the task list, checked-off steps,
# time estimates and the closing summary are what this job's log shows.
#   build  (GitHub-hosted)  the release tarball + install.sh
#   port   (DevLab)         install.sh, weaver init, weaver skills, then `weaver optimize MODEL roofline 20m`:
#                           all four tasks (Convert, Verify, Speed up, Final check) on a model that isn't ported yet
# Runs on pull requests that change weaver's own code or prompts, and on demand (any model).
on:
  pull_request:
    paths:
      - weaver/**
      - .github/workflows/port-check.yml
  workflow_dispatch:
    inputs:
      model:
        description: checkpoint
        default: unsloth/Qwen3.5-0.8B-GGUF
      budget:
        description: optimization budget
        default: 20m

permissions:
  contents: read

concurrency:
  group: port-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.LOOM_SKILLS_TOKEN || github.token }}   # loom-skills is private
      - run: packaging/build_bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: weaver-release
          path: |
            packaging/out/weaver-linux-x64.tar.gz
            packaging/out/install.sh
            packaging/out/SHA256SUMS
          retention-days: 7

  port:
    needs: build
    runs-on: [strix-halo, devlab-dispatch, Linux, self-hosted]
    timeout-minutes: 150
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ secrets.LOOM_SKILLS_TOKEN || github.token }}   # lets `weaver skills` compare with loom-skills main
      MODEL: ${{ inputs.model || 'unsloth/Qwen3.5-0.8B-GGUF' }}
      BUDGET: ${{ inputs.budget || '20m' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: weaver-release
          path: release
      - name: install (curl | bash, as a user does)
        run: |
          export WEAVER_HOME=$RUNNER_TEMP/weaver-home WEAVER_BIN_DIR=$RUNNER_TEMP/bin WEAVER_NO_MODIFY_PATH=1
          { echo "WEAVER_HOME=$WEAVER_HOME"; echo "PATH=$WEAVER_BIN_DIR:$PATH"; } >> "$GITHUB_ENV"
          curl -fsSL "file://$PWD/release/install.sh" | WEAVER_RELEASE_URL="file://$PWD/release" bash -s -- --no-init
      - name: weaver init (the local agent model)
        run: weaver init --skip-llamacpp
      - name: weaver skills
        run: weaver skills
      - name: weaver optimize ${{ env.MODEL }} roofline ${{ env.BUDGET }}
        run: weaver optimize "$MODEL" roofline "$BUDGET"
      - if: always()
        name: collect
        run: |
          d=$WEAVER_HOME/work/$(echo "$MODEL" | sed 's#/#__#'); mkdir -p out
          cp "$d"/phases.log "$d"/*.log "$d"/agent.jsonl "$d"/bench/report.md out/ 2>/dev/null || true
          cp "$WEAVER_HOME"/timings.jsonl out/ 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-logs
          path: out
