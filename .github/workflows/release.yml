name: release
# Push a tag v<version> (matching weaver/__init__.py) to build the bundle, run Tier 0 + Tier 1, and
# publish install.sh, weaver-linux-x64.tar.gz and SHA256SUMS as release assets (install.sh from the
# latest release is the install command: README). The agent trials ran on the PR
# (release-validation.yml, label `release-validation`). After publishing, a DevLab Dispatch Strix Halo
# runner installs the release the way a user does (curl | bash, init prompt) and runs evals/release_check.sh on it; if that
# fails, the release is marked as a pre-release so `latest` doesn't point at it.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.LOOM_SKILLS_TOKEN || github.token }}   # loom-skills is private
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: version matches the tag
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('weaver/__init__.py').read())[1])")
          test "v$v" = "${GITHUB_REF_NAME}"
      - run: pip install '.[test]' && pytest -q
      - run: packaging/build_bundle.sh
      - run: evals/tier1_container.sh packaging/out
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packaging/out/install.sh packaging/out/weaver-linux-x64.tar.gz packaging/out/SHA256SUMS \
            --title "weaver $GITHUB_REF_NAME" --notes-file docs/release-notes.md

  post-release-check:
    needs: release
    runs-on: [strix-halo, devlab-dispatch, Linux, self-hosted]
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: download the published release and check it
        run: |
          set -o pipefail
          TMPDIR=$RUNNER_TEMP bash evals/release_check.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" 2>&1 | tee release_check.log
      - if: failure()
        name: mark the release as a pre-release
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --prerelease
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check
          path: release_check.log
